# HelloDoc staging Blueprint (Milestone 9E)
# Provider: Render — clean empty PostgreSQL; never restore the local development DB.
#
# Before applying:
# 1. Create/connect a Render workspace and authorize this Git repository.
# 2. Confirm region (singapore) and paid Postgres plan for PITR with DartCodes.
# 3. Set secret env values in the Render Dashboard (see docs/STAGING-RUNBOOK.md).
#    Do not put passwords, encryption keys, or tokens in this file.
#
# After first successful deploy:
# - Run create-platform-admin against staging DATABASE_URL from a trusted machine
#   (or a one-off Render shell), using a strong password entered only in that shell.
# - Register two synthetic clinics via the HTTPS UI; do not import local fixtures.

databases:
  - name: hellodoc-staging-db
    plan: basic-1gb
    region: singapore
    postgresMajorVersion: '16'
    databaseName: hellodoc_staging
    # Private network only — API reaches DB over Render internal networking.
    ipAllowList: []

services:
  - type: web
    name: hellodoc-staging-api
    runtime: node
    plan: starter
    region: singapore
    rootDir: .
    buildCommand: npm ci && npm run db:generate && npm run build -w @hellodoc/api
    preDeployCommand: npm run prisma:deploy -w @hellodoc/api
    startCommand: npm run start -w @hellodoc/api
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22.22.3'
      - key: MFA_REQUIRED
        value: 'true'
      - key: DATABASE_SSL
        value: 'true'
      - key: COOKIE_SAMESITE
        value: none
      - key: SMS_PROVIDER
        value: fake
      - key: SMS_DISPATCH_ENABLED
        value: 'false'
      - key: SMS_DEFAULT_SENDER_ID
        value: HelloDoc
      - key: THROTTLE_LIMIT_PER_MINUTE
        value: '120'
      - key: THROTTLE_REGISTRATION_LIMIT
        value: '5'
      - key: THROTTLE_LOGIN_LIMIT
        value: '10'
      - key: PG_POOL_MAX
        value: '10'
      - key: DATABASE_URL
        fromDatabase:
          name: hellodoc-staging-db
          property: connectionString
      # Set these in the Dashboard after Blueprint create (sync: false).
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_WEB_ORIGIN
        sync: false
      - key: SMS_PAYLOAD_ENCRYPTION_KEY
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false

  - type: web
    name: hellodoc-staging-web
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build -w @hellodoc/web
    staticPublishPath: apps/web/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Must match the API public URL (+ /api). Adjust if the service name changes.
      - key: VITE_API_BASE_URL
        value: https://hellodoc-staging-api.onrender.com/api
