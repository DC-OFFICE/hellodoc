name: Deploy CapRover staging

# Build images on GitHub Actions, push to CapRover's own registry
# (registry.straightline.cloud:996), then CapRover pulls from that registry.
#
# Why not GHCR: org packages are private and cannot be made Public → CapRover
# gets "denied". Why not tar build: CapRover accepted deploys but left empty
# build logs / stayed on placeholder.
#
# Prerequisites (one-time):
#   1. CapRover apps hellodoc-staging-api / hellodoc-staging-web configured
#      (API port 4000, web port 80, HTTPS, env vars).
#   2. App Tokens enabled; GitHub secrets below set.
#   3. CapRover Cluster → Docker Registries already has captain @
#      registry.straightline.cloud:996 as default push registry.
#
# Never put DATABASE_URL / encryption keys in this YAML.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'apps/**'
      - 'deploy/caprover/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-staging.yml'
      - '.dockerignore'

concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Gate — CI checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @hellodoc/api
      - name: Build web (compile gate)
        env:
          VITE_API_BASE_URL: http://127.0.0.1:4000/api
        run: npm run build -w @hellodoc/web

  build-and-deploy:
    name: Build & deploy CapRover registry
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require CapRover secrets
        env:
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          CAPROVER_APP_TOKEN_API: ${{ secrets.CAPROVER_APP_TOKEN_API }}
          CAPROVER_APP_TOKEN_WEB: ${{ secrets.CAPROVER_APP_TOKEN_WEB }}
          CAPROVER_REGISTRY: ${{ secrets.CAPROVER_REGISTRY }}
          CAPROVER_REGISTRY_USER: ${{ secrets.CAPROVER_REGISTRY_USER }}
          CAPROVER_REGISTRY_PASSWORD: ${{ secrets.CAPROVER_REGISTRY_PASSWORD }}
          STAGING_VITE_API_BASE_URL: ${{ vars.STAGING_VITE_API_BASE_URL }}
        run: |
          missing=0
          for name in CAPROVER_SERVER CAPROVER_APP_TOKEN_API CAPROVER_APP_TOKEN_WEB \
            CAPROVER_REGISTRY CAPROVER_REGISTRY_USER CAPROVER_REGISTRY_PASSWORD; do
            eval "val=\${$name}"
            if [ -z "$val" ]; then
              echo "Missing secret: $name"
              missing=1
            fi
          done
          if [ -z "$STAGING_VITE_API_BASE_URL" ]; then
            echo "Missing repository variable: STAGING_VITE_API_BASE_URL"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "See docs/CAPROVER-STAGING.md → CI/CD secrets (CapRover registry)."
            exit 1
          fi

      - name: Image tags
        id: image
        env:
          CAPROVER_REGISTRY: ${{ secrets.CAPROVER_REGISTRY }}
        run: |
          # Expect CAPROVER_REGISTRY like: registry.straightline.cloud:996
          # CapRover image prefix for self-hosted registry is usually "captain"
          reg="${CAPROVER_REGISTRY}"
          sha='${{ github.sha }}'
          echo "api=${reg}/captain/hellodoc-staging-api:${sha}" >> "$GITHUB_OUTPUT"
          echo "api_latest=${reg}/captain/hellodoc-staging-api:staging" >> "$GITHUB_OUTPUT"
          echo "web=${reg}/captain/hellodoc-staging-web:${sha}" >> "$GITHUB_OUTPUT"
          echo "web_latest=${reg}/captain/hellodoc-staging-web:staging" >> "$GITHUB_OUTPUT"

      - name: Login to CapRover registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CAPROVER_REGISTRY }}
          username: ${{ secrets.CAPROVER_REGISTRY_USER }}
          password: ${{ secrets.CAPROVER_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/caprover/Dockerfile.api
          push: true
          tags: |
            ${{ steps.image.outputs.api }}
            ${{ steps.image.outputs.api_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/caprover/Dockerfile.web
          push: true
          tags: |
            ${{ steps.image.outputs.web }}
            ${{ steps.image.outputs.web_latest }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.STAGING_VITE_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy API to CapRover
        uses: caprover/deploy-from-github@v2
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: hellodoc-staging-api
          token: ${{ secrets.CAPROVER_APP_TOKEN_API }}
          image: ${{ steps.image.outputs.api }}

      - name: Deploy web to CapRover
        uses: caprover/deploy-from-github@v2
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: hellodoc-staging-web
          token: ${{ secrets.CAPROVER_APP_TOKEN_WEB }}
          image: ${{ steps.image.outputs.web }}

      - name: Verify staging is live
        env:
          API_BASE: ${{ vars.STAGING_VITE_API_BASE_URL }}
          WEB_URL: ${{ vars.STAGING_WEB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${WEB_URL:-}" ]; then
            WEB_URL=$(echo "$API_BASE" | sed -E 's|-api\.|-web.|; s|/api/?$||')
          fi
          echo "Checking web: $WEB_URL"
          echo "Checking API:  $API_BASE/health/live"

          ok=0
          for i in $(seq 1 20); do
            web_home=$(curl -fsS --max-time 30 "$WEB_URL/" || true)
            if echo "$web_home" | grep -qi 'Your app will be here'; then
              echo "Attempt $i: still CapRover placeholder; waiting…"
              sleep 20
              continue
            fi
            login_code=$(curl -sS -o /tmp/login.html -w "%{http_code}" --max-time 30 "$WEB_URL/login" || echo "000")
            live_code=$(curl -sS -o /tmp/live.json -w "%{http_code}" --max-time 30 "$API_BASE/health/live" || echo "000")
            echo "Attempt $i: /login=$login_code health/live=$live_code"
            if [ "$login_code" = "200" ] && [ "$live_code" = "200" ]; then
              ok=1
              break
            fi
            sleep 20
          done

          if [ "$ok" != "1" ]; then
            echo "::error::Staging smoke failed. CapRover Build Logs should show Pulling registry.straightline.cloud:996/captain/..."
            [ -f /tmp/login.html ] && head -c 400 /tmp/login.html || true
            [ -f /tmp/live.json ] && head -c 400 /tmp/live.json || true
            exit 1
          fi

          echo "Staging smoke OK: web SPA + /login + API /health/live"
