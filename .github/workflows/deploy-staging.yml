name: Deploy CapRover staging

# Build/push images to GHCR, then CapRover pulls them.
# CapRover can pull images:
#   1. Public packages: if GHCR packages are set to Public in GitHub package settings (no registry credentials needed in CapRover).
#   2. Private packages: CapRover Cluster -> Docker Registries row for ghcr.io:
#      Username = chamikathereal, Password = PAT (read:packages), Domain = ghcr.io, Image Prefix = chamikathereal
#
# Never put DATABASE_URL / encryption keys in this YAML.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'apps/**'
      - 'deploy/caprover/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-staging.yml'
      - '.dockerignore'

concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Gate — CI checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @hellodoc/api
      - name: Build web (compile gate)
        env:
          VITE_API_BASE_URL: http://127.0.0.1:4000/api
        run: npm run build -w @hellodoc/web

  build-and-deploy:
    name: Build images & deploy CapRover
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require CapRover secrets
        env:
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          CAPROVER_APP_TOKEN_API: ${{ secrets.CAPROVER_APP_TOKEN_API }}
          CAPROVER_APP_TOKEN_WEB: ${{ secrets.CAPROVER_APP_TOKEN_WEB }}
          STAGING_VITE_API_BASE_URL: ${{ vars.STAGING_VITE_API_BASE_URL }}
        run: |
          missing=0
          for name in CAPROVER_SERVER CAPROVER_APP_TOKEN_API CAPROVER_APP_TOKEN_WEB; do
            eval "val=\${$name}"
            if [ -z "$val" ]; then
              echo "Missing secret: $name"
              missing=1
            fi
          done
          if [ -z "$STAGING_VITE_API_BASE_URL" ]; then
            echo "Missing repository variable: STAGING_VITE_API_BASE_URL"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "See docs/CAPROVER-STAGING.md"
            exit 1
          fi

      - name: Lowercase image names
        id: image
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          sha='${{ github.sha }}'
          echo "api=ghcr.io/${owner}/hellodoc-staging-api:${sha}" >> "$GITHUB_OUTPUT"
          echo "api_latest=ghcr.io/${owner}/hellodoc-staging-api:staging" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${owner}/hellodoc-staging-web:${sha}" >> "$GITHUB_OUTPUT"
          echo "web_latest=ghcr.io/${owner}/hellodoc-staging-web:staging" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/caprover/Dockerfile.api
          push: true
          tags: |
            ${{ steps.image.outputs.api }}
            ${{ steps.image.outputs.api_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/caprover/Dockerfile.web
          push: true
          tags: |
            ${{ steps.image.outputs.web }}
            ${{ steps.image.outputs.web_latest }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.STAGING_VITE_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy API to CapRover
        uses: caprover/deploy-from-github@v2
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: hellodoc-staging-api
          token: ${{ secrets.CAPROVER_APP_TOKEN_API }}
          image: ${{ steps.image.outputs.api }}

      - name: Deploy web to CapRover
        uses: caprover/deploy-from-github@v2
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: hellodoc-staging-web
          token: ${{ secrets.CAPROVER_APP_TOKEN_WEB }}
          image: ${{ steps.image.outputs.web }}

      - name: Verify staging is live
        env:
          API_BASE: ${{ vars.STAGING_VITE_API_BASE_URL }}
          WEB_URL: ${{ vars.STAGING_WEB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${WEB_URL:-}" ]; then
            WEB_URL=$(echo "$API_BASE" | sed -E 's|-api\.|-web.|; s|/api/?$||')
          fi
          echo "Checking web: $WEB_URL"
          echo "Checking API:  $API_BASE/health/live"

          ok=0
          for i in $(seq 1 20); do
            web_home=$(curl -fsS --max-time 30 "$WEB_URL/" || true)
            if echo "$web_home" | grep -qi 'Your app will be here'; then
              echo "Attempt $i: still CapRover placeholder — CapRover could not pull GHCR (check that packages are Public or check Cluster ghcr.io registry with matching prefix and PAT)."
              sleep 20
              continue
            fi
            login_code=$(curl -sS -o /tmp/login.html -w "%{http_code}" --max-time 30 "$WEB_URL/login" || echo "000")
            live_code=$(curl -sS -o /tmp/live.json -w "%{http_code}" --max-time 30 "$API_BASE/health/live" || echo "000")
            echo "Attempt $i: /login=$login_code health/live=$live_code"
            if [ "$login_code" = "200" ] && [ "$live_code" = "200" ]; then
              ok=1
              break
            fi
            sleep 20
          done

          if [ "$ok" != "1" ]; then
            echo "::error::Staging smoke failed. CapRover Build Logs must show a successful pull of ${{ steps.image.outputs.api }}."
            [ -f /tmp/login.html ] && head -c 400 /tmp/login.html || true
            [ -f /tmp/live.json ] && head -c 400 /tmp/live.json || true
            exit 1
          fi

          echo "Staging smoke OK: web SPA + /login + API /health/live"
